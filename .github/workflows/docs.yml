name: Docs CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  docs-tests:
    name: Docs App Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        working-directory: apps/docs

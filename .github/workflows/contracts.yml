name: Contracts CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  contract-tests:
    name: Contract Tests (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run Soroban unit tests
        run: cd contracts && cargo test --workspace
